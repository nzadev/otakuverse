<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Glowing Accent Hexagon/Shield -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#neonGrad)" stroke-width="12" filter="url(#neonGlow)" opacity="0.6"/>

  <!-- Play Symbol + Kanji Stylization -->
  <polygon points="210,160 370,256 210,352" fill="url(#neonGrad)" filter="url(#neonGlow)"/>

  <!-- Cyber Dots -->
  <circle cx="256" cy="75" r="8" fill="#38bdf8" />
  <circle cx="256" cy="437" r="8" fill="#c084fc" />
</svg>
