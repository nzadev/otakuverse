name: Build OtakuVerse APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build OtakuVerse Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Prepare google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleGoogleAlpha --no-daemon

      - name: Find and Rename APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} output_apk/OtakuVerse.apk \;
          echo "APK generated:"
          ls -lh output_apk/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OtakuVerse-APK
          path: output_apk/OtakuVerse.apk
          retention-days: 14

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/OtakuVerse.apk
          name: OtakuVerse ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
