<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Download Otakuverse - Standalone App</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #00f0ff;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      text-align: center;
    }
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(11,15,25,0) 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 500px;
      padding: 40px 20px;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin: 20px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 20px rgba(0, 240, 255, 0.2);
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 10px;
      letter-spacing: 1px;
    }
    h1 span {
      color: var(--accent);
    }
    p {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px 32px;
      border-radius: 100px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.3s ease;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.6);
    }
    .download-btn svg {
      width: 24px;
      height: 24px;
    }
    .features {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .feature-item svg {
      color: var(--accent);
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <img src="logo.jpg" alt="Otakuverse Logo" class="logo">
    <h1>OTAKU<span>VERSE</span></h1>
    <p>Saksikan ribuan anime dengan kualitas HD, bebas iklan, dan update super cepat langsung dari smartphone Anda.</p>
    
    <a href="https://github.com/nzadev/otakuverse/raw/main/otakuverse.apk" class="download-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Unduh APK (Android)
    </a>

    <div class="features">
      <div class="feature-item">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        Streaming Tanpa Iklan
      </div>
      <div class="feature-item">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Update Tercepat Tiap Hari
      </div>
      <div class="feature-item">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        Resolusi hingga 1080p
      </div>
    </div>

    <div class="footer">
      &copy; 2026 Otakuverse Web Edition. All rights reserved.
    </div>
  </div>
</body>
</html>
